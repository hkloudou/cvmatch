name: Bench charts

# The only benchmark pipeline: one amd64 job measures native OpenCV C++
# and both cvmatch builds (default with the AVX2 kernels, and
# -tags purego), then renders benchdata.json and the measured matrix
# (markdown only — no charts by owner decision) and publishes them to
# the `assets` branch. main is never touched: the README links the
# stable assets URLs, so a refresh is one commit on `assets` and zero
# churn anywhere else. arm64 runs the scalar path by design and is
# correctness-tested in ci.yml, not benchmarked here.
#
# Runs weekly and on demand. Dispatch with publish=false to get the
# rendered charts as a workflow artifact instead of publishing (for perf
# iteration on a branch).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push results to the assets branch"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: bench-charts
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash with -eo pipefail, so a failing benchmark can't hide behind
        # the tee and get parsed into the published dataset
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Fetch real sample images (OpenCV samples/data)
        run: bench/testdata/fetch.sh
      - name: Build native OpenCV benchmark (prebuilt static OpenCV 4.12)
        working-directory: bench
        run: |
          go run ./cmd/dumpscenes -out cpp/scenes
          cpp/build.sh
      - name: Measure native OpenCV C++
        run: |
          mkdir -p /tmp/out
          (cd bench && cpp/native_bench cpp/scenes 7) | tee /tmp/out/native.txt
      - name: Tolerance parity vs native (drift column for the matrix)
        working-directory: bench
        run: |
          cpp/native_bench cpp/scenes 1 dump >/dev/null
          go run ./cmd/paritystat | tee /tmp/out/parity.txt
      - name: Measure cvmatch (-cpu 1,4, both builds)
        run: |
          go test -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m | tee /tmp/out/asm.txt
          go test -tags purego -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m | tee /tmp/out/go.txt
          CPU=$(lscpu | awk -F': +' '/Model name/{print $2; exit}')
          echo "GitHub Actions ubuntu-latest ($(nproc)-vCPU ${CPU:-unknown}, linux/amd64)" > /tmp/out/host.txt
      - name: Measure peak RSS (memprobe + native one-shot probe)
        working-directory: bench
        run: |
          go build -o /tmp/memprobe ./cmd/memprobe
          for impl in baseline cvmatch gray; do /tmp/memprobe -impl "$impl"; done | tee /tmp/out/memprobe.txt
          mkdir -p /tmp/mem1
          grep noise1080p_sub128 cpp/scenes/manifest.tsv > /tmp/mem1/manifest.tsv
          cp "cpp/scenes/$(awk '{print $4}' /tmp/mem1/manifest.tsv)" \
             "cpp/scenes/$(awk '{print $5}' /tmp/mem1/manifest.tsv)" /tmp/mem1/
          # one-shot probe: fresh process, exactly one end-to-end match,
          # peak RSS read by the process itself (comparable to memprobe)
          cpp/native_bench /tmp/mem1 1 mem | tee /tmp/native-mem.txt
          grep -o 'peakHWM=[0-9]*' /tmp/native-mem.txt | grep -o '[0-9]*' > /tmp/out/native-hwm.txt
      - name: Render benchdata and the measured matrix
        run: |
          mkdir -p assets/bench
          rm -f assets/bench/bench-*.svg assets/bench/mem-*.svg
          NATMEM=$(cat /tmp/out/native-hwm.txt)
          OPENCV=$(grep -m1 '^OPENCV_VER=' bench/cpp/build.sh | cut -d'"' -f2)
          python3 docs/collect.py \
            --asm /tmp/out/asm.txt --go /tmp/out/go.txt \
            --native /tmp/out/native.txt \
            --mem /tmp/out/memprobe.txt \
            ${NATMEM:+--native-mem "$NATMEM"} \
            --parity /tmp/out/parity.txt \
            ${OPENCV:+--opencv "$OPENCV"} \
            --host "$(cat /tmp/out/host.txt)" \
            -o assets/bench/benchdata.json
          {
            echo "### Refreshed measured matrix"
            cat assets/bench/matrix.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the assets branch
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        working-directory: assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bench/
          if git diff --cached --quiet; then
            echo "measurements unchanged"
          else
            git commit -m "bench: refresh measured charts and matrix"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'schedule' || inputs.publish) }}
        with:
          name: rendered-charts
          path: assets/bench/
