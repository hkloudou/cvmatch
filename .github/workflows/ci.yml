name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Unit tests, cgo core explicit (float64 reference, cores parity, thread bit-identity)
        run: CGO_ENABLED=1 go test -v ./...
      - name: Race detector (concurrent use + parallel cores)
        run: CGO_ENABLED=1 go test -race ./...
      - name: Vet
        run: go vet ./... && cd bench && go vet ./...
      - name: Pure-Go core tests (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./... && CGO_ENABLED=0 go vet .
      - name: Cross-compile smoke (CGO_ENABLED=0, no C toolchain)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build ./...

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Fetch real sample images (OpenCV samples/data)
        run: bench/testdata/fetch.sh
      - name: Peak RSS (VmHWM, fresh process per implementation)
        working-directory: bench
        run: |
          go build -o bin/memprobe ./cmd/memprobe
          {
            echo "### Peak memory (1080p / 128px match)"
            echo '```'
            for impl in baseline cvmatch gray; do ./bin/memprobe -impl "$impl"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native OpenCV C++ benchmark (prebuilt static OpenCV 4.12)
        working-directory: bench
        run: |
          go run ./cmd/dumpscenes -out cpp/scenes
          cpp/build.sh
          {
            echo "### Native OpenCV C++ (end-to-end, static OpenCV 4.12)"
            echo '```'
            cpp/native_bench cpp/scenes 5 dump
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Match + MatchMap parity vs native C++ (cgo core)
        working-directory: bench
        run: go test -v -run 'TestFullMapParityWithNativeCpp|TestThreeWayValues' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Match + MatchMap parity vs native C++ (pure-Go core)
        working-directory: bench
        run: CGO_ENABLED=0 go test -v -run 'TestFullMapParityWithNativeCpp|TestThreeWayValues' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: cvmatch matrix — cgo core, 1 and 4 threads
        run: |
          {
            echo "### cvmatch cgo core (CGO_ENABLED=1), -cpu 1,4"
            echo '```'
            go test -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cvmatch matrix — pure-Go core (CGO_ENABLED=0), 1 and 4 threads
        run: |
          {
            echo "### cvmatch pure-Go core (CGO_ENABLED=0), -cpu 1,4"
            echo '```'
            CGO_ENABLED=0 go test -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Binary size
        working-directory: bench
        run: |
          go build -ldflags="-s -w" -o bin/binsize-cvmatch ./cmd/binsize-cvmatch
          {
            echo "### Minimal binary size (-ldflags \"-s -w\")"
            echo '```'
            ls -l bin/binsize-cvmatch
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
