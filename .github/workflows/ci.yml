name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Golden constants change only via `make regolden` + a "Goldens:" trailer
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if ! git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- golden_hashes_test.go; then
            git log --format=%B "origin/${{ github.base_ref }}"..HEAD | grep -q 'Goldens:' || {
              echo 'golden_hashes_test.go changed without a "Goldens:" trailer in the commit log.'
              echo 'Re-record deliberately: make regolden REASON="..." and explain the change.'
              exit 1
            }
          fi
      - name: Unit tests — default build (SIMD kernels + asm-vs-scalar parity, golden anchors)
        run: go test -v ./...
      - name: Unit tests — no-asm build (-tags purego, scalar safe mode)
        run: go test -tags purego -v ./...
      - name: Race detector (both builds)
        run: |
          go test -race ./...
          go test -tags purego -race ./...
      - name: Vet (both builds)
        run: |
          go vet ./... && go vet -tags purego ./...
          cd bench && go vet ./...
      - name: Cross-compile smoke (no C toolchain; 386/riscv64/wasm take the scalar fallback)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=riscv64 go build ./...
          GOOS=wasip1 GOARCH=wasm go build ./...
          # purego must be harmless everywhere — vet compiles test files
          # too, which plain `go build` does not
          GOOS=linux GOARCH=riscv64 go vet -tags purego ./...
          GOOS=linux GOARCH=386 go vet -tags purego ./...
          GOOS=darwin GOARCH=arm64 go build -tags purego ./...

  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Fetch real sample images (OpenCV samples/data)
        run: bench/testdata/fetch.sh
      - name: NEON kernel stream matches kernels.S (generator is deterministic)
        run: |
          python3 internal/simd/_gen/gen.py
          git diff --exit-code internal/simd/simd_arm64.s
      - name: Unit tests — default build (NEON kernels on real hardware, golden anchors)
        run: go test -v ./...
      - name: Unit tests — no-asm build (-tags purego)
        run: go test -tags purego -v ./...
      - name: Race detector (both builds)
        run: |
          go test -race ./...
          go test -tags purego -race ./...
      # Benchmark matrices cost real minutes and their numbers are only
      # meaningful from the canonical bench-charts pipeline, so they run
      # here only when explicitly dispatched (the perf-iteration loop).
      - name: cvmatch matrix — arm64 NEON (default build), 1 and 4 threads
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### arm64 default build (NEON), -cpu 1,4"
            echo '```'
            go test -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: cvmatch matrix — arm64 no-asm build (-tags purego), 1 and 4 threads
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### arm64 no-asm build (-tags purego), -cpu 1,4"
            echo '```'
            go test -tags purego -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Correctness gate against native OpenCV: build the C++ binary, dump its
  # response maps once (no timing loops), and pin the public API
  # element-wise in both build modes. All benchmarking lives in
  # bench-charts.yml — dispatch that (or this workflow, for the
  # matrix-only steps above) when numbers are wanted.
  parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Fetch real sample images (OpenCV samples/data)
        run: bench/testdata/fetch.sh
      - name: Build native OpenCV binary and dump reference maps
        working-directory: bench
        run: |
          go run ./cmd/dumpscenes -out cpp/scenes
          cpp/build.sh
          cpp/native_bench cpp/scenes 1 dump > /dev/null
      - name: Match + MatchMap parity vs native C++ (default build)
        working-directory: bench
        run: go test -v -run 'TestFullMapParityWithNativeCpp|TestNativeValues' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Match + MatchMap parity vs native C++ (no-asm build)
        working-directory: bench
        run: go test -tags purego -v -run 'TestFullMapParityWithNativeCpp|TestNativeValues' | tee -a "$GITHUB_STEP_SUMMARY"
