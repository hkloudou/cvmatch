name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Unit tests — default build (pure Go, golden output anchors)
        run: go test -v ./...
      - name: Unit tests — SIMD build (-tags cvmatch_asm, AVX2 kernels + asm-vs-scalar parity)
        run: go test -tags cvmatch_asm -v ./...
      - name: Race detector (both builds)
        run: |
          go test -race ./...
          go test -tags cvmatch_asm -race ./...
      - name: Vet (both builds)
        run: |
          go vet ./... && go vet -tags cvmatch_asm ./...
          cd bench && go vet ./...
      - name: Cross-compile smoke (no C toolchain anywhere)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build -tags cvmatch_asm ./...
          GOOS=linux GOARCH=arm64 go build -tags cvmatch_asm ./...
          GOOS=linux GOARCH=riscv64 go build ./...

  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Fetch real sample images (OpenCV samples/data)
        run: bench/testdata/fetch.sh
      - name: NEON kernel stream matches kernels.S (generator is deterministic)
        run: |
          python3 internal/simd/_gen/gen.py
          git diff --exit-code internal/simd/simd_arm64.s
      - name: Unit tests — default build (pure Go, golden output anchors)
        run: go test -v ./...
      - name: Unit tests — SIMD build (NEON kernels on real hardware)
        run: go test -tags cvmatch_asm -v ./...
      - name: Race detector (both builds)
        run: |
          go test -race ./...
          go test -tags cvmatch_asm -race ./...
      # Benchmark matrices cost real minutes and their numbers are only
      # meaningful from the canonical bench-charts pipeline, so they run
      # here only when explicitly dispatched (the perf-iteration loop).
      - name: cvmatch matrix — arm64 NEON (-tags cvmatch_asm), 1 and 4 threads
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### arm64 SIMD build (NEON, -tags cvmatch_asm), -cpu 1,4"
            echo '```'
            go test -tags cvmatch_asm -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: cvmatch matrix — arm64 default build (pure Go), 1 and 4 threads
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### arm64 default build (pure Go), -cpu 1,4"
            echo '```'
            go test -run xxx -bench 'BenchmarkMatch/|BenchmarkMatchGray/' -benchtime 5x -cpu 1,4 -timeout 90m
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Correctness gate against native OpenCV: build the C++ binary, dump its
  # response maps once (no timing loops), and pin the public API
  # element-wise in both build modes. All benchmarking lives in
  # bench-charts.yml — dispatch that (or this workflow, for the
  # matrix-only steps above) when numbers are wanted.
  parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Fetch real sample images (OpenCV samples/data)
        run: bench/testdata/fetch.sh
      - name: Build native OpenCV binary and dump reference maps
        working-directory: bench
        run: |
          go run ./cmd/dumpscenes -out cpp/scenes
          cpp/build.sh
          cpp/native_bench cpp/scenes 1 dump > /dev/null
      - name: Match + MatchMap parity vs native C++ (default build)
        working-directory: bench
        run: go test -v -run 'TestFullMapParityWithNativeCpp|TestNativeValues' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Match + MatchMap parity vs native C++ (SIMD build)
        working-directory: bench
        run: go test -tags cvmatch_asm -v -run 'TestFullMapParityWithNativeCpp|TestNativeValues' | tee -a "$GITHUB_STEP_SUMMARY"
