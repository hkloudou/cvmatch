name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bench/go.sum
      - name: Unit tests (float64 reference parity)
        run: go test -v ./...
      - name: Vet
        run: go vet ./... && cd bench && go vet ./...
      - name: Static library size
        run: |
          make lib
          {
            echo "### libcvmatch.a"
            echo '```'
            ls -l libcvmatch.a
            size cvmatch.o | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Numeric parity vs OpenCV (hkloudou/cv2)
        run: cd bench && go test -v -run 'Parity' | tee -a "$GITHUB_STEP_SUMMARY"

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bench/go.sum
      - name: Benchmarks (cvmatch vs hkloudou/cv2)
        working-directory: bench
        run: |
          go test -run xxx -bench . -benchtime 5x -timeout 50m | tee bench.txt
          {
            echo "### Benchmarks"
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Peak RSS (VmHWM, fresh process per implementation)
        working-directory: bench
        run: |
          go build -o bin/memprobe ./cmd/memprobe
          {
            echo "### Peak memory (1080p / 128px match)"
            echo '```'
            for impl in baseline cv2 cvmatch gray; do ./bin/memprobe -impl "$impl"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Binary sizes
        working-directory: bench
        run: |
          go build -ldflags="-s -w" -o bin/binsize-cvmatch ./cmd/binsize-cvmatch
          go build -ldflags="-s -w" -o bin/binsize-cv2 ./cmd/binsize-cv2
          {
            echo "### Minimal binary sizes (-ldflags \"-s -w\")"
            echo '```'
            ls -l bin/binsize-cvmatch bin/binsize-cv2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
